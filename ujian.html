<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ujian - USAHID Solo</title>
<style>
  body{font-family:Arial,sans-serif;max-width:700px;margin:0 auto;padding:16px;background:#f8fafc}
  .card{background:#fff;padding:16px;border-radius:12px;box-shadow:0 2px 8px rgba(0,0,0,.08);margin-bottom:12px}
  #timer{font-size:28px;font-weight:bold;text-align:center;padding:12px;border-radius:10px;color:#fff}
  .hijau{background:#16a34a}.kuning{background:#eab308;color:#000}.merah{background:#dc2626}
  button{padding:10px 16px;border:none;border-radius:8px;background:#2563eb;color:#fff;font-weight:bold;cursor:pointer;width:100%;margin-top:8px}
  .opt{display:block;width:100%;text-align:left;padding:10px;margin:6px 0;border:1px solid #cbd5e1;border-radius:8px;background:#fff;color:#111 !important;cursor:pointer}
  .opt b{color:#111 !important}
  .opt:hover{background:#eff6ff}
  textarea{width:100%;min-height:100px;padding:10px;border-radius:8px;border:1px solid #cbd5e1;color:#111}
  .btnHijau{background:#16a34a}.btnAbu{background:#64748b}
</style>
</head>
<body>
<h2 id="judul">Memuat Ujian...</h2>
<div id="timer" class="hijau">--:--</div>
<div id="info" class="card">Menghubungkan ke server...</div>
<div id="soalBox" class="card" style="display:none"></div>
<div id="navBox" class="card" style="display:none">
  <div id="progress"></div>
  <button id="btnLewat">Lewati Dulu, Kerjakan Lainnya →</button>
</div>
<script>
const API = "https://script.google.com/macros/s/AKfycbxOb93EOtRsz980tV-lWvDfadWdUnZMMMNj0yNnbtPkj5lXd5nTPse8CkmKKqxDV0KY/exec";
const params = new URLSearchParams(location.search);
const kodeUjian = params.get("kodeUjian") || params.get("kodeujian") || "";
let nim = params.get("nim") || localStorage.getItem("nim") || localStorage.getItem("NIM") || "";
try{
  const u = JSON.parse(localStorage.getItem("user") || localStorage.getItem("mahasiswa") || "{}");
  if(!nim) nim = u.nim || u.NIM || u.nidn || "";
}catch(e){}
let ujian = null, soalList = [], sudahJawab = new Set(), idx = 0, timerInterval = null, ujianSelesai = false;
async function getJSON(url){ const r = await fetch(url); return await r.json(); }
async function mulai(){
  if(!kodeUjian){ document.getElementById("info").innerHTML = "Kode ujian tidak ada."; return; }
  if(!nim){ document.getElementById("info").innerHTML = "Silakan login dulu."; return; }
  try{
    const listUjian = await getJSON(API + "?page=ujian");
    ujian = listUjian.find(u => String(u.KodeUjian) === String(kodeUjian));
    if(!ujian){ document.getElementById("info").innerHTML = "Ujian tidak ditemukan."; return; }
    document.getElementById("judul").innerText = ujian.Judul + " - " + ujian.KodeUjian;
    soalList = await getJSON(API + "?page=soal&kodeUjian=" + encodeURIComponent(kodeUjian));
    if(!soalList || soalList.length === 0){ document.getElementById("info").innerHTML = "Soal belum ada."; return; }
    const jwb = await getJSON(API + "?page=jawaban&nim=" + encodeURIComponent(nim) + "&kodeUjian=" + encodeURIComponent(kodeUjian));
    (jwb||[]).forEach(j => sudahJawab.add(String(j.NoSoal)));
    jalanTimer();
    tampilSoal();
  }catch(err){ document.getElementById("info").innerHTML = "Gagal: " + err.message; }
}
function parseJam(val){
  if(!val) return "00:00";
  let s = String(val);
  if(s.includes("T")){
    let d = new Date(s);
    let wib = new Date(d.getTime() + 7*60*60*1000);
    return String(wib.getUTCHours()).padStart(2,"0") + ":" + String(wib.getUTCMinutes()).padStart(2,"0");
  }
  return s.slice(0,5);
}
function parseTanggal(val){
  if(!val) return "";
  let s = String(val);
  if(s.includes("T")){
    let d = new Date(s);
    let wib = new Date(d.getTime() + 7*60*60*1000);
    return wib.getUTCFullYear() + "-" + String(wib.getUTCMonth()+1).padStart(2,"0") + "-" + String(wib.getUTCDate()).padStart(2,"0");
  }
  return s.slice(0,10);
}
function jalanTimer(){
  const info = document.getElementById("info");
  const tgl = parseTanggal(ujian.Tanggal);
  const jamMulai = parseJam(ujian.JamMulai);
  const jamSelesai = parseJam(ujian.JamSelesai);
  async function update(){
    try{
      const srv = await getJSON(API + "?page=servertime");
      const now = new Date(srv.now);
      const tglNowStr = now.getFullYear() + "-" + String(now.getMonth()+1).padStart(2,"0") + "-" + String(now.getDate()).padStart(2,"0");
      const tglUjianDate = new Date(tgl + "T00:00:00+07:00");
      const tglNowDate = new Date(tglNowStr + "T00:00:00+07:00");
      if(tglNowDate < tglUjianDate){
        document.getElementById("timer").innerText = "BELUM DIMULAI";
        info.innerHTML = "Ujian: <b>"+ujian.Judul+"</b><br>Tanggal: "+tgl+"<br>Mulai: "+jamMulai+" - Selesai: "+jamSelesai;
        return;
      }
      if(tglNowDate > tglUjianDate){
        document.getElementById("timer").innerText = "SELESAI";
        info.innerHTML = "Ujian sudah lewat tanggal.";
        document.getElementById("soalBox").style.display="none";
        document.getElementById("navBox").style.display="none";
        clearInterval(timerInterval);
        return;
      }
      const mulai = new Date(tgl + "T" + jamMulai + ":00+07:00");
      const selesai = new Date(tgl + "T" + jamSelesai + ":00+07:00");
      if(now < mulai){
        document.getElementById("timer").innerText = "BELUM MULAI - " + jamMulai;
        info.innerHTML = "Menunggu jam mulai.";
        return;
      }
      if(now >= selesai){
        document.getElementById("timer").innerText = "WAKTU HABIS";
        document.getElementById("timer").className = "merah";
        info.innerHTML = "Waktu habis.";
        document.getElementById("soalBox").style.display="none";
        document.getElementById("navBox").style.display="none";
        clearInterval(timerInterval);
        return;
      }
      const sisaDetik = Math.floor((selesai - now) / 1000);
      const mm = String(Math.floor(sisaDetik / 60)).padStart(2,"0");
      const dd = String(sisaDetik % 60).padStart(2,"0");
      const el = document.getElementById("timer");
      el.innerText = "Sisa Waktu: " + mm + ":" + dd;
      if(sisaDetik > 600) el.className = "hijau";
      else if(sisaDetik > 300) el.className = "kuning";
      else el.className = "merah";
      info.innerHTML = "Ujian: <b>" + ujian.Judul + "</b><br>Mulai: " + jamMulai + " - Selesai: " + jamSelesai;
      // JANGAN PAKSA TAMPIL LAGI KALAU SUDAH SELESAI
      if(!ujianSelesai){
        document.getElementById("soalBox").style.display = "block";
        document.getElementById("navBox").style.display = "block";
      }
    }catch(e){ info.innerHTML = "Gagal jam server: " + e.message; }
  }
  update();
  timerInterval = setInterval(update, 5000);
}
function tampilSoal(){
  if(sudahJawab.size >= soalList.length){
    ujianSelesai = true;
    document.getElementById("progress").innerText = "Sudah: " + sudahJawab.size + " / " + soalList.length + " - SELESAI";
    document.getElementById("soalBox").innerHTML = "<h3>✅ Semua soal sudah dijawab.</h3><p>Jawaban Bapak sudah tersimpan di server. Bapak bisa kembali ke dashboard.</p><button class='btnHijau' onclick='selesaiUjian()'>🏁 Selesai & Kembali ke Dashboard</button><button class='btnAbu' onclick='location.reload()'>🔄 Refresh</button>";
    document.getElementById("soalBox").style.display = "block";
    document.getElementById("navBox").style.display = "none";
    document.getElementById("timer").innerText = "SELESAI MENGERJAKAN";
    return;
  }
  let ketemu = -1;
  for(let k=0;k<soalList.length;k++){
    let i = (idx + k) % soalList.length;
    if(!sudahJawab.has(String(soalList[i].NoSoal))){ ketemu = i; break; }
  }
  idx = ketemu;
  const s = soalList[idx];
  document.getElementById("progress").innerText = "Soal ke-" + s.NoSoal + " | Sudah: " + sudahJawab.size + " / " + soalList.length;
  let html = "<b>Soal " + s.NoSoal + "</b><p>" + s.Soal + "</p>";
  if(String(s.JenisSoal||"").toLowerCase().includes("esai")){
    html += '<textarea id="jawabEsai" placeholder="Tulis jawaban..."></textarea><button onclick="kirimEsai()">Kirim Esai</button>';
  } else {
    ["A","B","C","D"].forEach(h => {
      const isi = s["Pilihan"+h] || "";
      if(isi) html += '<button class="opt" onclick="kirimMC(\''+h+'\')"><b>'+h+'.</b> '+isi+'</button>';
    });
  }
  document.getElementById("soalBox").innerHTML = html;
  document.getElementById("navBox").style.display = "block";
}
function selesaiUjian(){
  // Kembali ke halaman utama / dashboard
  window.location.href = "index.html?nim=" + encodeURIComponent(nim);
}
async function kirimMC(jawaban){
  const s = soalList[idx];
  const hasil = await getJSON(API + "?page=submitJawaban&nim=" + encodeURIComponent(nim) + "&kodeUjian=" + encodeURIComponent(kodeUjian) + "&noSoal=" + encodeURIComponent(s.NoSoal) + "&jawaban=" + encodeURIComponent(jawaban));
  if(hasil.success){ sudahJawab.add(String(s.NoSoal)); idx++; tampilSoal(); } else alert(hasil.message);
}
async function kirimEsai(){
  const v = document.getElementById("jawabEsai").value.trim();
  if(!v) return alert("Esai kosong");
  const s = soalList[idx];
  const hasil = await getJSON(API + "?page=submitJawaban&nim=" + encodeURIComponent(nim) + "&kodeUjian=" + encodeURIComponent(kodeUjian) + "&noSoal=" + encodeURIComponent(s.NoSoal) + "&jawaban=" + encodeURIComponent(v));
  if(hasil.success){ sudahJawab.add(String(s.NoSoal)); idx++; tampilSoal(); } else alert(hasil.message);
}
document.getElementById("btnLewat").onclick = function(){ idx++; tampilSoal(); };
mulai();
</script>
</body>
</html>
