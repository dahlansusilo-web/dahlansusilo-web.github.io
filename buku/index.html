<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Katalog Buku</title>
<style>body{font-family:sans-serif;background:#f9f5f0;margin:0;padding:20px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px;max-width:1000px;margin:auto}.card{background:white;border-radius:12px;padding:14px;box-shadow:0 4px 12px rgba(0,0,0,.06)}.card img{width:100%;height:280px;object-fit:cover;border-radius:8px;background:#eee}input{width:100%;max-width:1000px;margin:0 auto 20px;display:block;padding:12px;border-radius:8px;border:1px solid #ddd}</style>
</head>
<body>
<h2 style="text-align:center">📚 Katalog Buku</h2>
<input id="cari" placeholder="Cari judul, penulis, tahun..." oninput="filterBuku()">
<div id="grid" class="grid"></div>
<script>
let books=[];
async function load(){
  try{
    let res = await fetch('books.json?v='+Date.now());
    books = await res.json();
  }catch(e){
    books = JSON.parse(localStorage.getItem('books')||'[]');
  }
  tampil(books);
}
function tampil(data){
  document.getElementById('grid').innerHTML = data.map(b=>`
    <div class="card">
      <img src="${b.cover||'https://via.placeholder.com/200x280?text=No+Cover'}" onerror="this.src='https://via.placeholder.com/200x280?text=No+Cover'">
      <h4 style="margin:8px 0 4px">${b.judul||'-'}</h4>
      <small>${b.penulis||''} - ${b.tahun||''}</small><br>
      <small style="color:#666">${b.penerbit||''} | ${b.jenis||''}</small>
      <p style="font-size:12px;color:#444">${(b.deskripsi||'').slice(0,80)}</p>
      ${b.link?`<a href="${b.link}" target="_blank" style="font-size:12px;color:#0ea5e9">📄 Baca</a>`:''}
    </div>
  `).join('') || '<p style="text-align:center;color:#999">Belum ada buku. Tambah di /admin.html</p>';
}
function filterBuku(){
  let q = cari.value.toLowerCase();
  tampil(books.filter(b=> (b.judul+b.penulis+b.tahun).toLowerCase().includes(q) ));
}
load();
</script>
</body>
</html>
