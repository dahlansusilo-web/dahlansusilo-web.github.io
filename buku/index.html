<script>
let allBooks = [];

async function loadBooks(){
  const res = await fetch('books.json?v='+Date.now());
  allBooks = await res.json();
  // URUT TAHUN TERBARU DI ATAS
  allBooks.sort((a,b)=> parseInt(b.tahun) - parseInt(a.tahun));
  render(allBooks);
}

function render(books){
  const c = document.getElementById('list');
  c.innerHTML = books.map(b=>`
    <div class="book">
      <h3>${b.judul}</h3>
      <small>
        ${b.penulis} • ${b.tahun} • ${b.penerbit} • ISBN: ${b.isbn}<br>
        ${b.jenis} • ${b.halaman} hlm
      </small>
    </div>
  `).join('');
}

// FILTER DARI PENCARIAN (bisa cari jenis, tahun, penulis, judul)
document.getElementById('search').addEventListener('input', e=>{
  let q = e.target.value.toLowerCase();
  let filtered = allBooks.filter(b => 
    (b.judul+b.penulis+b.tahun+b.jenis+b.penerbit+b.isbn).toLowerCase().includes(q)
  );
  render(filtered);
});

loadBooks();
</script>
