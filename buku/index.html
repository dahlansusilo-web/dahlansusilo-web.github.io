<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Admin Buku Lengkap</title>
<style>
body{font-family:sans-serif;max-width:650px;margin:40px auto;padding:20px}
input,select,textarea{width:100%;padding:10px;margin:8px 0;border:1px solid #ddd;border-radius:8px;box-sizing:border-box}
button{padding:10px 18px;border:none;border-radius:8px;cursor:pointer;font-weight:600;margin-right:6px;margin-top:6px}
.btn-dark{background:#0f172a;color:white}
.btn-green{background:#16a34a;color:white}
.btn-blue{background:#0ea5e9;color:white}
.btn-orange{background:#f59e0b;color:white}
.btn-red{background:#dc2626;color:white;float:right}
#list{margin-top:20px}
.item{border-bottom:1px solid #eee;padding:10px 0;font-size:13px;display:flex;justify-content:space-between}
</style>
</head>
<body>

<a href="#" onclick="logout()" class="btn-red" style="text-decoration:none;padding:8px 16px;border-radius:8px">Logout</a>
<h2>Admin Buku Lengkap</h2>

<input id="penulis" placeholder="Penulis">
<input id="tahun" type="number" placeholder="Tahun">
<input id="judul" placeholder="Judul Buku">
<input id="penerbit" placeholder="Penerbit">
<input id="isbn" placeholder="ISBN">
<select id="jenis">
  <option value="">-- Pilih Jenis --</option>
  <option>Buku Ajar</option>
  <option>Buku Referensi</option>
  <option>Monograf</option>
  <option>Modul</option>
</select>
<input id="halaman" type="number" placeholder="Jumlah Halaman">
<input id="cover" placeholder="Link Cover / cover1.jpg">
<input id="drive" placeholder="Link Drive">
<textarea id="deskripsi" placeholder="Deskripsi" rows="3"></textarea>

<button class="btn-dark" onclick="simpanBuku()">Simpan Buku</button>
<button class="btn-green" onclick="exportJson()">Export books.json</button>
<button class="btn-blue" onclick="exportToSheet()">📊 Export ke Google Sheet</button>
<button class="btn-orange" onclick="exportCSV()">📄 Export CSV</button>

<div id="list"></div>

<script>
// GANTI URL INI DENGAN URL WEB APP DARI GOOGLE SHEET SAMPEAN
const SHEET_URL = "https://script.google.com/macros/s/XXXX/exec";

let books = JSON.parse(localStorage.getItem("books") || "[]");

function render(){
  document.getElementById("list").innerHTML = books.map((b,i)=>`
    <div class="item"><span>${b.tahun} - ${b.judul}</span> <a href="#" onclick="hapus(${i})">hapus</a></div>
  `).join("");
}
render();

function simpanBuku(){
  const b = {
    penulis: penulis.value, tahun: tahun.value, judul: judul.value,
    penerbit: penerbit.value, isbn: isbn.value, jenis: jenis.value,
    halaman: halaman.value, cover: cover.value, link: drive.value,
    deskripsi: deskripsi.value
  };
  if(!b.judul) return alert("Judul wajib diisi");
  books.push(b);
  localStorage.setItem("books", JSON.stringify(books));
  render();
  alert("Tersimpan! Total: "+books.length+" buku");
  // kosongkan
  judul.value=""; deskripsi.value="";
}

function exportJson(){
  let blob = new Blob([JSON.stringify(books,null,2)], {type:"application/json"});
  let a = document.createElement("a"); a.href = URL.createObjectURL(blob);
  a.download = "books.json"; a.click();
}

async function exportToSheet(){
  if(books.length==0) return alert("Belum ada data!");
  if(SHEET_URL.includes("XXXX")) return alert("Bro, ganti dulu SHEET_URL nya dengan URL Web App dari Google Sheet!");
  try{
    await fetch(SHEET_URL, {method:"POST", mode:"no-cors", body: JSON.stringify(books)});
    alert("Berhasil dikirim ke Google Sheet! Cek Sheet sampean bro.");
  }catch(e){ alert("Gagal: "+e.message); }
}

function exportCSV(){
  let csv = "Penulis,Tahun,Judul,Penerbit,ISBN,Jenis,Halaman,Cover,Drive,Deskripsi\n";
  books.forEach(b=>{ csv += `"${b.penulis}","${b.tahun}","${b.judul}","${b.penerbit}","${b.isbn}","${b.jenis}","${b.halaman}","${b.cover}","${b.link}","${(b.deskripsi||'').replace(/\"/g,'')}"\n`; });
  let blob = new Blob([csv], {type:"text/csv"});
  let a = document.createElement("a"); a.href = URL.createObjectURL(blob);
  a.download = "buku-dahlan.csv"; a.click();
}

function hapus(i){ if(confirm("Hapus?")){ books.splice(i,1); localStorage.setItem("books", JSON.stringify(books)); render(); } }
function logout(){ localStorage.removeItem("isLogin"); location.href="login.html"; }
</script>
</body>
</html>
