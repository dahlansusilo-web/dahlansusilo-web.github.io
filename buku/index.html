<!DOCTYPE html><html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Katalog Buku</title><style>body{margin:0;font-family:sans-serif;background:#fdfaf6}header{background:#fff;padding:16px;border-bottom:1px solid #eee;position:sticky;top:0;z-index:10}.wrap{max-width:1300px;margin:auto;display:flex;gap:12px;flex-wrap:wrap;justify-content:space-between;align-items:center}.wrap input{flex:1;padding:11px;border:1px solid #ddd;border-radius:10px;max-width:500px}.table-wrap{max-width:1300px;margin:20px auto;padding:0 16px;overflow:auto}table{width:100%;border-collapse:collapse;background:#fff;border-radius:12px;overflow:hidden;box-shadow:0 4px 14px rgba(0,0,0,.06);min-width:900px}th{background:#0f172a;color:#fff;padding:12px 10px;text-align:left;font-size:13px}td{padding:10px;border-bottom:1px solid #f1f5f9;font-size:13px;vertical-align:top}td img{width:60px;height:80px;object-fit:cover;border-radius:6px}tr:hover{background:#f8fafc}.btn{padding:6px 10px;background:#0f172a;color:#fff;border-radius:6px;text-decoration:none;font-size:11px;display:inline-block}</style></head><body>
<header><div class="wrap"><b>📚 Katalog Buku</b><input id="cari" placeholder="Cari judul, penulis, tahun..." oninput="filterBuku()"><span id="status" style="font-size:12px;color:#0ea5e9"></span></div></header>
<div class="table-wrap"><table><thead><tr><th>No</th><th>Cover</th><th>Judul</th><th>Penulis</th><th>Tahun</th><th>Penerbit</th><th>ISBN / Jenis / Hal</th><th>Aksi</th></tr></thead><tbody id="tbody"><tr><td colspan="8" style="text-align:center;padding:30px;color:#999">Loading...</td></tr></tbody></table></div>
<script>
const SHEET_URL = "https://script.google.com/macros/s/AKfycbwVBcduHoQsSjV21I28w8zljg_ulQkB1y6-kew-cgLAi_I6NutbEqQZcPi2db1nn-Kz/exec";
let books=[];async function loadBuku(){try{let r=await fetch(SHEET_URL+"?t="+Date.now());books=await r.json();status.textContent="Live: "+books.length+" buku";}catch(e){status.textContent="Gagal GS, pakai backup";books=JSON.parse(localStorage.getItem('books')||'[]');}tampil(books);}
function tampil(d){let tb=document.getElementById('tbody');if(!d.length){tb.innerHTML='<tr><td colspan="8" style="text-align:center">Belum ada buku</td></tr>';return}tb.innerHTML=d.map((b,i)=>`<tr><td>${i+1}</td><td><img src="${b.cover||''}" onerror="this.src='https://via.placeholder.com/60x80?text=No'"></td><td><b>${b.judul||''}</b></td><td>${b.penulis||''}</td><td>${b.tahun||''}</td><td>${b.penerbit||''}</td><td>${b.isbn||''}<br>${b.jenis||''} ${b.halaman?`• ${b.halaman} hal`:''}</td><td>${b.link?`<a class="btn" href="${b.link}" target="_blank">Baca</a>`:''}</td></tr>`).join('');}
function filterBuku(){let q=cari.value.toLowerCase();tampil(books.filter(b=>`${b.judul} ${b.penulis} ${b.tahun} ${b.isbn}`.toLowerCase().includes(q)));}
loadBuku();
</script></body></html>
