<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Katalog Buku</title>
<style>body{margin:0;font-family:sans-serif;background:#fdfaf6}header{background:#fff;padding:16px;border-bottom:1px solid #eee;position:sticky;top:0;z-index:10}.wrap{max-width:1100px;margin:auto;display:flex;gap:12px;flex-wrap:wrap;justify-content:space-between;align-items:center}.wrap input{flex:1;padding:11px;border:1px solid #ddd;border-radius:10px;max-width:420px} .grid{max-width:1100px;margin:20px auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:16px;padding:0 16px}.card{background:#fff;border-radius:14px;overflow:hidden;box-shadow:0 4px 14px rgba(0,0,0,.06)}.cover{width:100%;height:320px;object-fit:cover;background:#eee}.body{padding:12px}.btn{display:block;margin-top:8px;padding:8px;background:#0f172a;color:#fff;text-align:center;border-radius:8px;text-decoration:none;font-size:12px} #status{font-size:12px;color:#0ea5e9}</style>
</head>
<body>
<header><div class="wrap"><b>📚 Katalog Buku</b><input id="cari" placeholder="Cari judul / penulis..." oninput="filterBuku()"><span id="status">Loading...</span></div></header>
<div id="grid" class="grid"></div>
<script>
const SHEET_URL = "https://script.google.com/macros/s/AKfycbw0SZBZdt8MFIuIBWF5X2FeNegBmmS647NkAmpai35WeIrL2Fcv5_mIj2BgB1WYVlgn/exec";
let books=[];
async function loadBuku(){
  try{
    let res = await fetch(SHEET_URL+"?t="+Date.now());
    books = await res.json();
    document.getElementById('status').textContent = "Live GS: "+books.length+" buku";
  }catch(e){
    document.getElementById('status').textContent = "Gagal GS, pakai backup";
    books = JSON.parse(localStorage.getItem('books')||'[]');
  }
  tampil(books);
}
function tampil(d){
  let g=document.getElementById('grid');
  if(!d.length){g.innerHTML='<p style="text-align:center;color:#999;grid-column:1/-1">Belum ada buku di Google Sheet. Tambah di admin.html</p>';return}
  g.innerHTML=d.map(b=>`
    <div class="card">
      <img class="cover" src="${b.cover||''}" onerror="this.src='https://via.placeholder.com/300x420?text=No+Cover'">
      <div class="body"><b>${b.judul}</b><br><small>${b.penulis||''} - ${b.tahun||''}</small><br><small style="color:#666">${b.penerbit||''} • ${b.jenis||''}</small>
      ${b.link?`<a class="btn" href="${b.link}" target="_blank">📄 Baca</a>`:''}
      </div>
    </div>`).join('');
}
function filterBuku(){let q=document.getElementById('cari').value.toLowerCase(); tampil(books.filter(b=>`${b.judul} ${b.penulis} ${b.tahun}`.toLowerCase().includes(q)))}
loadBuku();
</script>
</body>
</html>
