<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Profil</title>
<style>
body{margin:0;font-family:Inter,sans-serif;background:#fdfaf6;color:#1e293b}
header{background:#fff;padding:14px 20px;border-bottom:1px solid #eee;position:sticky;top:0;z-index:10}
.head{max-width:1100px;margin:auto;display:flex;justify-content:space-between;align-items:center}
a{color:#0f172a;text-decoration:none}
.hero{max-width:1100px;margin:28px auto;background:#fff;border-radius:16px;box-shadow:0 8px 24px rgba(0,0,0,.07);display:flex;flex-wrap:wrap;overflow:hidden}
.left{flex:0 0 340px;background:#0f172a;color:#fff;padding:32px;text-align:center}
.left img{width:170px;height:170px;border-radius:50%;object-fit:cover;border:4px solid #fff;background:#334155}
.right{flex:1;padding:32px 36px}
.tag{display:inline-block;background:#e0f2fe;color:#0c4a6e;padding:5px 12px;border-radius:20px;font-size:12px;margin:4px}
.card{max-width:1100px;margin:18px auto;background:#fff;border-radius:16px;box-shadow:0 4px 14px rgba(0,0,0,.06);padding:26px}
h2{margin:0 0 14px;border-left:4px solid #0f172a;padding-left:12px}
table{width:100%;border-collapse:collapse;font-size:14px}
td{padding:10px;border-bottom:1px solid #f1f5f9;vertical-align:top}
td:first-child{width:150px;color:#64748b}
#loading{text-align:center;padding:60px;color:#999}
</style>
</head>
<body>
<header><div class="head"><b>📚 Dahlan Susilo</b><nav style="display:flex;gap:16px;font-size:14px"><a href="./">Home</a><a href="buku/">Katalog Buku</a><a href="profil.html"><b>Profil</b></a></nav></div></header>

<div id="loading">⏳ Memuat profil dari Google Sheet...</div>

<div id="content" style="display:none">
  <div class="hero">
    <div class="left">
      <img id="foto" alt="foto">
      <h2 id="namaLengkap" style="border:none;padding:0;margin:14px 0 6px"></h2>
      <p id="jabatan" style="font-size:13px;color:#cbd5e1;margin:0"></p>
      <div id="bidang" style="margin-top:16px"></div>
    </div>
    <div class="right">
      <h2>Tentang Saya</h2>
      <p id="tentang" style="line-height:1.8;color:#334155;white-space:pre-line"></p>
      <table>
        <tr><td>Email</td><td id="email"></td></tr>
        <tr><td>Scholar</td><td><a id="scholar" target="_blank" style="color:#0ea5e9">Lihat Publikasi</a></td></tr>
        <tr><td>GitHub</td><td><a id="github" target="_blank" style="color:#0ea5e9"></a></td></tr>
      </table>
    </div>
  </div>
  <div class="card">
    <h2>Buku Terbaru</h2>
    <div id="buku_terbaru" style="line-height:1.9;color:#334155;white-space:pre-line"></div>
    <p style="margin-top:14px"><a href="buku/"><b>→ Lihat Katalog Buku Lengkap</b></a></p>
  </div>
</div>

<script>
const SHEET_URL = "https://script.google.com/macros/s/AKfycbwVBcduHoQsSjV21I28w8zljg_ulQkB1y6-kew-cgLAi_I6NutbEqQZcPi2db1nn-Kz/exec";

async function loadProfil(){
  try{
    const res = await fetch(SHEET_URL + "?page=profil&t=" + Date.now());
    const p = await res.json();
    if(p.error){ document.getElementById('loading').innerHTML = p.error; return; }

    // Ambil dengan toleransi spasi di header
    const get = (k) => p[k] || p[k.replace(' ','')] || p[k.toLowerCase()] || p[Object.keys(p).find(x=>x.toLowerCase().replace(/\s/g,'')===k.toLowerCase().replace(/\s/g,''))] || '';

    const gd = get('gelardepan') || '';
    const nama = get('nama') || '';
    const gb = get('gelar belakang') || get('gelarbelakang') || '';
    const foto = get('foto');
    const jabatan = get('jabatan');
    const tentang = get('tentang');
    const email = get('email');
    const scholar = get('scholar');
    const github = get('github');
    const bidang = get('bidang');
    const buku = get('buku_terbaru');

    const fullName = `${gd ? gd+' ' : ''}${nama}${gb ? ', '+gb : ''}`.trim();
    
    document.getElementById('namaLengkap').textContent = fullName;
    document.title = fullName + " - Profil";
    document.getElementById('foto').src = foto || "https://via.placeholder.com/300?text=Foto";
    document.getElementById('jabatan').textContent = jabatan;
    document.getElementById('tentang').textContent = tentang;
    document.getElementById('email').textContent = email;
    document.getElementById('scholar').href = scholar || "#";
    document.getElementById('github').href = github || "#";
    document.getElementById('github').textContent = github;
    document.getElementById('buku_terbaru').textContent = buku;
    document.getElementById('bidang').innerHTML = (bidang||'').split(',').map(s=> s.trim() ? `<span class="tag">${s.trim()}</span>` : '').join('');

    document.getElementById('loading').style.display='none';
    document.getElementById('content').style.display='block';
  }catch(e){
    document.getElementById('loading').textContent = "Gagal load: " + e + " - Pastikan Sheet tab 'Profil' sudah ada dan sudah Deploy New Version";
  }
}
loadProfil();
</script>
</body>
</html>
