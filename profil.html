<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Profil - Dahlan Susilo</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@700&family=Inter:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <div style="display:flex;align-items:center;gap:10px;font-weight:700;color:#7c2d12;font-size:14px">
    <img src="/logo-usahidsolo.png" style="width:42px;height:42px;object-fit:contain" alt="Logo USAHID">
    <div style="line-height:1.15"><div style="font-size:16px;letter-spacing:.3px;">UNIVERSITAS SAHID SURAKARTA</div></div>
  </div>
  <div style="display:flex;align-items:center;gap:18px">
    <nav id="autoNav" style="display:flex;gap:20px"></nav>
    <img id="fotoTop" src="" style="width:38px;height:38px;border-radius:50%;object-fit:cover;border:2px solid #f5e6d3;display:none" alt="Foto">
  </div>
</header>
<script src="/menu.js"></script>

<div class="profil-wrap"><div class="profil-card">
<div class="profil-left">
<img id="pFoto" src="" alt="Foto Profil">
<h1 id="pNama">Memuat...</h1>
<p id="pJabatan"></p>
<p id="pBidang"></p>
</div>
<div class="profil-right">
<h2>Tentang Saya</h2>
<p id="pTentang"></p>
<div class="profil-info">
<div id="rowEmail"><b>Email</b><a id="pEmail" href=""></a></div>
<div id="rowScholar"><b>Google Scholar</b><a id="pScholar" href="" target="_blank"></a></div>
<div id="rowGithub"><b>GitHub</b><a id="pGithub" href="" target="_blank"></a></div>
</div>
<!-- BUKU TERBARU DIBUANG, SUDAH ADA DI buku/ LENGKAP URUT TAHUN DESCENDING -->
<p style="margin-top:20px"><a href="buku/" style="color:#7c2d12;font-weight:600">📚 Lihat Semua Buku →</a></p>
</div>
</div>
<div class="back-wrap"><a class="back-btn" href="index.html">← Kembali</a></div>
</div>

<script>
async function loadProfil(){
  try{
    const r = await fetch("profil.json");
    const d = await r.json();
    const nama = [d.gelardepan||"", d.nama||"", d.gelar_belakang||""].join(" ").replace(/\s+/g," ").trim();
    document.getElementById("pNama").textContent = nama;
    document.getElementById("pJabatan").textContent = d.jabatan || "";
    document.getElementById("pBidang").textContent = d.bidang || "";
    document.getElementById("pTentang").textContent = d.tentang || "";
    if(d.foto){
      document.getElementById("pFoto").src = d.foto;
      const top = document.getElementById("fotoTop");
      if(top){ top.src = d.foto; top.style.display = "block"; }
    }
    if(d.email){ const e=document.getElementById("pEmail"); e.textContent=d.email; e.href="mailto:"+d.email; }
    if(d.scholar){ const s=document.getElementById("pScholar"); s.textContent=d.scholar; s.href=d.scholar; }
    if(d.github){ const g=document.getElementById("pGithub"); g.textContent=d.github; g.href=d.github; }
  }catch(e){ document.getElementById("pTentang").textContent="Gagal memuat profil.json: "+e.message; }
}
loadProfil();
</script>
</body></html>
