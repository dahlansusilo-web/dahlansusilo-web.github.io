<!DOCTYPE html>
<html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Profil - Dahlan Susilo</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@700&family=Inter:wght@400;600&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',sans-serif;background:#f9f5f0;color:#2d1a12}
.wrap{max-width:1100px;margin:30px auto;padding:0 20px}
.hero-card{background:white;border-radius:32px;overflow:hidden;box-shadow:0 20px 60px rgba(60,20,10,0.07);display:flex;flex-wrap:wrap}
.left{flex:0 0 340px;background:#7c2d12;color:#f5e6d3;padding:36px 28px;text-align:center}
.left img{width:180px;height:180px;border-radius:50%;object-fit:cover;border:6px solid #fff;background:#fff}
.left h1{font-family:'Plus Jakarta Sans',sans-serif;font-size:26px;margin:16px 0 4px}
.left p{opacity:.9}
.right{flex:1;padding:36px}
.right h2{font-family:'Plus Jakarta Sans',sans-serif;margin-bottom:12px}
.right p{line-height:1.7;margin-bottom:12px}
.info{margin-top:20px;display:grid;gap:10px}
.info div{background:#f9f5f0;padding:12px 14px;border-radius:12px}
.info b{display:block;font-size:12px;text-transform:uppercase;letter-spacing:.5px;color:#7c2d12;margin-bottom:2px}
.info a{color:#2563eb;word-break:break-all}
.buku{margin-top:20px;background:#7c2d12;color:#fff;padding:16px;border-radius:16px}
.buku b{font-size:18px}
.back-wrap{text-align:center;margin:24px 0 40px}
.back-btn{display:inline-block;background:white;color:#7c2d12;text-decoration:none;font-weight:700;padding:12px 32px;border-radius:999px;box-shadow:0 4px 16px rgba(0,0,0,.08)}
</style></head>
<body>
<div class="wrap"><div class="hero-card">
<div class="left">
<img id="pFoto" src="" alt="Foto Profil">
<h1 id="pNama">Memuat...</h1>
<p id="pJabatan"></p>
<p id="pBidang"></p>
</div>
<div class="right">
<h2>Tentang Saya</h2>
<p id="pTentang"></p>
<div class="info">
<div id="rowEmail"><b>Email</b><a id="pEmail" href=""></a></div>
<div id="rowScholar"><b>Google Scholar</b><a id="pScholar" href="" target="_blank"></a></div>
<div id="rowGithub"><b>GitHub</b><a id="pGithub" href="" target="_blank"></a></div>
</div>
<div class="buku" id="rowBuku">📖 <b>Buku Terbaru:</b> <span id="pBuku"></span></div>
</div>
</div>
<div class="back-wrap"><a class="back-btn" href="index.html">← Kembali</a></div>
</div>

<script>
const API = "https://script.google.com/macros/s/AKfycbxOb93EOtRsz980tV-lWvDfadWdUnZMMMNj0yNnbtPkj5lXd5nTPse8CkmKKqxDV0KY/exec";

function fixFoto(u){
  if(!u) return "";
  u = String(u).trim();
  // Kalau di GS masih keisi judul halaman GitHub, paksa ke raw file
  if(u.includes("Foto") && !u.startsWith("http")) return "https://raw.githubusercontent.com/dahlansusilo-web/dahlansusilo-web.github.io/main/Foto%2011%20KB.jpeg";
  if(u.includes("github.com") && u.includes("/blob/")) return u.replace("github.com","raw.githubusercontent.com").replace("/blob/","/");
  return u;
}
async function loadProfil(){
  try{
    const r = await fetch(API + "?page=profil");
    const txt = await r.text();
    if(txt.trim().startsWith("<")) throw new Error("Balikan HTML, cek deployment Apps Script");
    const j = JSON.parse(txt);
    const d = Array.isArray(j) ? j[0] : j;
    if(!d || !d.nama) throw new Error("Data Profil kosong");

    // Key persis header GS, gelar belakang pakai spasi
    const nama = [d.gelardepan||"", d.nama||"", d["gelar belakang"]||""].join(" ").replace(/\s+/g," ").trim();
    document.getElementById("pNama").textContent = nama;
    document.getElementById("pJabatan").textContent = d.jabatan || "";
    document.getElementById("pBidang").textContent = d.bidang || "";
    document.getElementById("pTentang").textContent = String(d.tentang||"").replace("s=di","di").replace("dimualai","dimulai");

    const foto = fixFoto(d.foto);
    if(foto) document.getElementById("pFoto").src = foto;

    if(d.email){ const e=document.getElementById("pEmail"); e.textContent=d.email; e.href="mailto:"+d.email; }
    else document.getElementById("rowEmail").style.display="none";

    if(d.scholar){ const s=document.getElementById("pScholar"); s.textContent=d.scholar; s.href=d.scholar; }
    else document.getElementById("rowScholar").style.display="none";

    if(d.github){ const g=document.getElementById("pGithub"); g.textContent=d.github; g.href=String(d.github).startsWith("http")?d.github:"https://github.com/"+d.github; }
    else document.getElementById("rowGithub").style.display="none";

    if(d.buku_terbaru){ document.getElementById("pBuku").textContent=d.buku_terbaru; }
    else document.getElementById("rowBuku").style.display="none";

  }catch(e){
    document.getElementById("pTentang").textContent = "Gagal memuat dari GS: " + e.message;
  }
}
loadProfil();
</script>
</body></html>
