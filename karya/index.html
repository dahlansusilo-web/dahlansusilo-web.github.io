<!DOCTYPE html><html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Karya - USAHID Solo</title>
<!-- VERSI-KARYA-DEBUG-2026-11-05 -->
<style>
*{box-sizing:border-box} body{margin:0;font-family:Inter,system-ui,sans-serif;background:#f9f5f0;color:#222}
header{background:#fff;padding:12px 20px;display:flex;justify-content:space-between;align-items:center;box-shadow:0 2px 8px rgba(0,0,0,.06);position:sticky;top:0;z-index:10}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;color:#7c2d12;text-decoration:none;font-size:15px}
.logo img{width:42px;height:42px;object-fit:contain}
.btn{padding:6px 14px;border-radius:20px;text-decoration:none;font-weight:600;font-size:13px}
.btn-coklat{background:#7c2d12;color:#fff}
.wrap{max-width:900px;margin:24px auto;padding:0 16px}
h2{color:#7c2d12;margin:0 0 4px}
.sub{color:#666;font-size:13px;margin-bottom:16px}
.card{background:#fff;border-radius:12px;padding:18px;margin-bottom:14px;box-shadow:0 1px 6px rgba(0,0,0,.07)}
.card h3{margin:0 0 6px;color:#7c2d12}
.meta{font-size:13px;color:#666;margin-bottom:8px}
.badge{display:inline-block;background:#fef3c7;color:#92400e;padding:3px 10px;border-radius:20px;font-size:12px;font-weight:700;margin-left:6px}
.desc{font-size:14px;line-height:1.6}
pre{background:#111;color:#0f0;padding:12px;border-radius:8px;overflow:auto;font-size:12px;white-space:pre-wrap;word-break:break-word}
</style></head>
<body>
<header>
  <a class="logo" href="/"><img src="/logo-usahidsolo.png" onerror="this.style.display='none'"> USAHID SOLO - KARYA</a>
  <div><a class="btn btn-coklat" href="/kuliah/login.html">Login Kuliah</a></div>
</header>
<div class="wrap">
  <h2>Karya Mahasiswa</h2>
  <p class="sub"><a href="/" style="color:#7c2d12;text-decoration:none">← Beranda</a> • Informasi umum, dapat dibuka tanpa login</p>
  <p style="font-size:11px;color:#999">Versi: KARYA-DEBUG-2026-11-05</p>
  <div id="status" style="background:#fff;padding:12px;border-radius:8px;margin-bottom:12px;font-size:13px">Memuat...</div>
  <div id="list-karya"></div>
  <h3>Data Mentah dari Server:</h3>
  <pre id="debug">Belum ada data</pre>
</div>
<script>
const API = "https://script.google.com/macros/s/AKfycbxOb93EOtRsz980tV-lWvDfadWdUnZMMMNj0yNnbtPkj5lXd5nTPse8CkmKKqxDV0KY/exec";
function setHTML(id, html){ var el=document.getElementById(id); if(el) el.innerHTML=html; }
function setText(id, txt){ var el=document.getElementById(id); if(el) el.innerText=txt; }
function ambil(obj, daftar){
  for(let i=0;i<daftar.length;i++){
    for(let k in obj){
      if(String(k).trim().toLowerCase()===daftar[i]) return obj[k];
    }
  }
  return "";
}
async function loadKarya(){
  try{
    setText('status','Menghubungi: '+API+'?page=karya');
    const r = await fetch(API+"?page=karya&t="+Date.now());
    setText('status','Status HTTP: '+r.status+' | OK: '+r.ok);
    const teks = await r.text();
    setText('debug', teks);
    let data = [];
    try{ data = JSON.parse(teks); }catch(e){ setText('status','Gagal mengubah ke JSON: '+e.message); return; }
    let list = Array.isArray(data) ? data : (data.data || data.karya || []);
    setText('status','Status HTTP: '+r.status+' | Jumlah data: '+list.length);
    if(!list.length){
      setHTML('list-karya','<p style="text-align:center">Belum ada karya yang dipublikasikan (jumlah data = 0)</p>');
      return;
    }
    setHTML('list-karya', list.map(function(x){
      const nomor = ambil(x, ["nonor","nomor","no","id"]) || "";
      const judul = ambil(x, ["judul","judul_karya","nama_karya","title","nama"]) || "Tanpa Judul";
      const tahun = ambil(x, ["tahun","tahun_terbit"]) || "";
      const jenis = ambil(x, ["jenis","kategori","type"]) || "";
      const ket = ambil(x, ["keterangan","deskripsi","abstrak","ringkasan"]) || "";
      const link = ambil(x, ["link_gd","link","link_drive","url","file"]) || "";
      return '<div class="card"><h3>'+judul+(jenis ? ' <span class="badge">'+jenis+'</span>' : '')+'</h3>'
        + '<div class="meta">'+(nomor ? 'No: '+nomor+' • ' : '')+(tahun ? 'Tahun: '+tahun : '')+'</div>'
        + (ket ? '<div class="desc">'+ket+'</div>' : '')
        + (link ? '<a href="'+link+'" target="_blank" rel="noopener" style="display:inline-block;margin-top:10px;background:#7c2d12;color:#fff;padding:7px 16px;border-radius:8px;text-decoration:none;font-weight:700;font-size:13px">📄 Lihat Karya</a>' : '')
        + '</div>';
    }).join(''));
  }catch(err){
    setText('status','GAGAL FETCH: '+err.message);
    setText('debug','Error: '+err.message);
    setHTML('list-karya','<p style="text-align:center">Gagal memuat karya: '+err.message+'</p>');
  }
}
loadKarya();
</script>
</body></html>
