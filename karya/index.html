<!DOCTYPE html><html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Karya Dosen - USAHID Solo</title>
<style>
*{box-sizing:border-box} body{margin:0;font-family:Inter,system-ui,sans-serif;background:#f9f5f0;color:#222}
header{background:#fff;padding:12px 20px;display:flex;justify-content:space-between;align-items:center;box-shadow:0 2px 8px rgba(0,0,0,.06);position:sticky;top:0;z-index:10}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;color:#7c2d12;text-decoration:none;font-size:15px}
.logo img{width:42px;height:42px;object-fit:contain}
.btn{padding:6px 14px;border-radius:20px;text-decoration:none;font-weight:600;font-size:13px}
.btn-coklat{background:#7c2d12;color:#fff}
.wrap{max-width:900px;margin:24px auto;padding:0 16px}
h2{color:#7c2d12;margin:0 0 4px}
.sub{color:#666;font-size:13px;margin-bottom:16px}
table{width:100%;border-collapse:collapse;background:#fff;border-radius:12px;overflow:hidden;box-shadow:0 1px 6px rgba(0,0,0,.07)}
th{background:#7c2d12;color:#fff;text-align:left;padding:12px;font-size:13px}
td{padding:12px;border-top:1px solid #eee;font-size:14px;vertical-align:top}
tr:nth-child(even) td{background:#fdf8f4}
.badge{display:inline-block;background:#fef3c7;color:#92400e;padding:3px 10px;border-radius:20px;font-size:12px;font-weight:700}
.btn-lihat{background:#7c2d12;color:#fff;padding:6px 12px;border-radius:8px;text-decoration:none;font-weight:700;font-size:13px;display:inline-block}
.kembali{display:inline-block;margin-top:20px;color:#7c2d12;text-decoration:none;font-weight:700;font-size:14px}
#error-box{display:none;background:#fdecea;color:#7c2d12;padding:12px;border-radius:8px;margin-bottom:12px;font-size:13px}
</style></head>
<body>
<header>
  <a class="logo" href="/"><img src="/logo-usahidsolo.png" onerror="this.style.display='none'"> USAHID SOLO - KARYA DOSEN</a>
  <div><a class="btn btn-coklat" href="/kuliah/login.html">Login Kuliah</a></div>
</header>
<div class="wrap">
  <h2>Karya Dosen</h2>
  <p class="sub">Informasi umum, dapat dibuka tanpa login</p>
  <div id="error-box"></div>
  <div id="list-karya"><p style="text-align:center;padding:20px">Memuat karya dosen...</p></div>
  <a class="kembali" href="/">← Kembali ke Beranda</a>
</div>
<script>
const API = "https://script.google.com/macros/s/AKfycbxOb93EOtRsz980tV-lWvDfadWdUnZMMMNj0yNnbtPkj5lXd5nTPse8CkmKKqxDV0KY/exec";
function setHTML(id, html){ var el=document.getElementById(id); if(el) el.innerHTML=html; }
function ambil(obj, daftar){
  for(let i=0;i<daftar.length;i++){
    for(let k in obj){
      if(String(k).trim().toLowerCase()===daftar[i]) return obj[k];
    }
  }
  return "";
}
async function loadKarya(){
  try{
    const r = await fetch(API+"?page=karya&t="+Date.now());
    if(!r.ok) throw new Error('Gagal terhubung ke server');
    const data = await r.json();
    let list = Array.isArray(data) ? data : (data.data || data.karya || []);
    if(!list.length){
      setHTML('list-karya','<p style="text-align:center">Belum ada karya dosen yang dipublikasikan</p>');
      return;
    }
    let html = '<table><thead><tr><th>No</th><th>Judul</th><th>Tahun</th><th>Jenis</th><th>Keterangan</th></tr></thead><tbody>';
    list.forEach(function(x){
      const nomor = ambil(x, ["nonor","nomor","no","id"]) || "";
      const judul = ambil(x, ["judul","judul_karya","nama_karya","title","nama"]) || "Tanpa Judul";
      const tahun = ambil(x, ["tahun","tahun_terbit"]) || "";
      const jenis = ambil(x, ["jenis","kategori","type"]) || "";
      const ket = ambil(x, ["keterangan","deskripsi","abstrak","ringkasan"]) || "";
      html += '<tr><td>'+nomor+'</td><td><strong>'+judul+'</strong></td><td>'+tahun+'</td><td>'+(jenis ? '<span class="badge">'+jenis+'</span>' : '')+'</td><td>'+ket+'</td></tr>';
    });
    html += '</tbody></table>';
    setHTML('list-karya', html);
  }catch(err){
    setHTML('list-karya','<p style="text-align:center">Gagal memuat karya dosen</p>');
    var eb=document.getElementById('error-box');
    if(eb){ eb.style.display='block'; eb.innerText='Terjadi kesalahan saat memuat. Detail: '+err.message; }
  }
}
loadKarya();
</script>
</body></html>
