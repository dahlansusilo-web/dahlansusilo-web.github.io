<!DOCTYPE html><html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Karya</title>
<style>body{font-family:sans-serif;background:#f9f5f0;margin:0}header{background:white;padding:12px 20px;display:flex;justify-content:space-between;align-items:center} .wrap{max-width:1000px;margin:20px auto;padding:0 16px} .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px} .card{background:white;border-radius:16px;padding:18px;border:1px solid #e9ddd0} .card h3{color:#7c2d12} .badge{background:#f0e6d3;padding:4px 8px;border-radius:12px;font-size:11px;font-weight:700} .btn{display:inline-block;margin-top:24px;background:#0f172a;color:#fff;padding:12px 20px;border-radius:10px;text-decoration:none;font-weight:700}</style></head><body>
<header><b style="color:#7c2d12">USAHID SOLO</b><div><a href="/" style="color:#7c2d12;font-weight:700;text-decoration:none">Beranda</a></div></header>
<div class="wrap"><h2 style="color:#7c2d12">Karya</h2><div id="list">Loading...</div><div style="text-align:center"><a href="/" class="btn">⬅ Kembali ke Beranda</a> <a href="/buku/" class="btn" style="background:#7c2d12;margin-left:8px">📚 Buku</a></div></div>
<script>
const API="https://script.google.com/macros/s/AKfycbxOb93EOtRsz980tV-lWvDfadWdUnZMMMNj0yNnbtPkj5lXd5nTPse8CkmKKqxDV0KY/exec";
fetch(API+"?page=karya&t="+Date.now()).then(r=>r.json()).then(d=>{
  let el=document.getElementById('list');
  if(!d.length){el.innerHTML='Belum ada karya';return}
  el.innerHTML='<div class="grid">'+d.map(x=>`<div class="card"><h3>${x.judul}</h3><p style="font-size:13px;color:#555;margin:8px 0">${x.keterangan||''}</p><span class="badge">${x.tahun}</span> <span class="badge">${x.jenis}</span> <span class="badge">No ${x.nonor}</span></div>`).join('')+'</div>';
});
</script></body></html>
