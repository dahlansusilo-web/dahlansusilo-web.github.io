<script>
// Ambil foto dari Sheet Profil biar otomatis foto sampean yang muncul
const URL_PROFIL = "https://script.google.com/macros/s/AKfycbwVBcduHoQsSjV21I28w8zljg_ulQkB1y6-kew-cgLAi_I6NutbEqQZcPi2db1nn-Kz/exec";
fetch(URL_PROFIL+"?page=profil&t="+Date.now()).then(r=>r.json()).then(p=>{
  if(p.foto){
    document.getElementById('fotoTop').src = p.foto;
    document.getElementById('fotoTop').style.display = 'block';
  }
});
</script>
