<!DOCTYPE html><html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Karya</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@700&display=swap" rel="stylesheet">
<style>
body{background:#f9f5f0;margin:0;font-family:Inter,sans-serif}
header{background:white;padding:12px 20px;display:flex;justify-content:space-between;align-items:center;box-shadow:0 2px 8px rgba(0,0,0,.06);position:sticky;top:0;z-index:10}
.wrap{max-width:1100px;margin:24px auto;padding:0 16px}
.table-wrap{background:white;border-radius:18px;overflow:hidden;box-shadow:0 10px 30px rgba(0,0,0,.06);border:1px solid #e9ddd0;overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:600px}
th{background:#7c2d12;color:#fff8f0;padding:14px 12px;text-align:left;font-size:12px;text-transform:uppercase;letter-spacing:.5px}
td{padding:14px 12px;border-bottom:1px solid #f0e6d3;font-size:14px;color:#3d2a22}
tr:last-child td{border-bottom:none}
tr:hover td{background:#fff8f0}
.badge{background:#f0e6d3;color:#7c2d12;padding:4px 10px;border-radius:20px;font-size:11px;font-weight:700}
.btn{display:inline-block;background:#7c2d12;color:white;padding:12px 22px;border-radius:12px;text-decoration:none;font-weight:700;box-shadow:0 4px 14px rgba(124,45,18,.3)}
</style></head><body>
<header>
<div style="display:flex;align-items:center;gap:10px;font-weight:800;color:#7c2d12">
<img src="../logo-usahidsolo.png" onerror="this.src='/logo-usahidsolo.png'" style="width:42px;height:42px;object-fit:contain"> USAHID SOLO
</div>
<a href="/" style="color:#7c2d12;font-weight:700;text-decoration:none">Beranda</a>
</header>
<div class="wrap">
<h2 style="color:#7c2d12;font-family:'Plus Jakarta Sans'">Karya</h2>
<div class="table-wrap">
<table>
<thead><tr><th>No</th><th>Judul</th><th>Tahun</th><th>Jenis</th><th>Keterangan</th></tr></thead>
<tbody id="list"><tr><td colspan="5" style="text-align:center;padding:30px">⏳ Memuat Sheet Karya...</td></tr></tbody>
</table>
</div>
<div style="text-align:center;margin-top:28px">
<a class="btn" href="/">⬅ Kembali ke Beranda</a>
<a class="btn" style="margin-left:10px" href="/buku/">📚 Buku</a>
</div>
</div>
<script>
const API="https://script.google.com/macros/s/AKfycbxOb93EOtRsz980tV-lWvDfadWdUnZMMMNj0yNnbtPkj5lXd5nTPse8CkmKKqxDV0KY/exec";
fetch(API+"?page=karya&t="+Date.now()).then(r=>r.json()).then(d=>{
  let el=document.getElementById('list');
  if(!d || !d.length){ el.innerHTML='<tr><td colspan=5 style="text-align:center">Kosong</td></tr>'; return; }
  el.innerHTML = d.map(x=>`<tr><td>${x.nonor||''}</td><td style="font-weight:700;color:#7c2d12">${x.judul||'-'}</td><td><span class="badge">${x.tahun||''}</span></td><td>${x.jenis||''}</td><td>${x.keterangan||''}</td></tr>`).join('');
}).catch(e=>{ document.getElementById('list').innerHTML='<tr><td colspan=5>Gagal: '+e+'</td></tr>'; });
</script>
</body></html>
