<!DOCTYPE html><html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Karya</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@700&display=swap" rel="stylesheet">
<style>
body{background:#f9f5f0;margin:0;font-family:Inter,sans-serif}
header{background:white;padding:12px 20px;display:flex;justify-content:space-between;align-items:center;box-shadow:0 2px 8px rgba(0,0,0,.06);position:sticky;top:0}
.wrap{max-width:1100px;margin:24px auto;padding:0 16px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px;margin-top:16px}
.card{background:white;border-radius:18px;padding:20px;border:1px solid #e9ddd0;box-shadow:0 6px 18px rgba(0,0,0,.05)}
.card h3{color:#7c2d12;margin:0 0 8px;font-family:'Plus Jakarta Sans'}
.badge{background:#f0e6d3;color:#7c2d12;padding:5px 10px;border-radius:20px;font-size:11px;font-weight:700;margin-right:4px}
.btn{display:inline-block;background:#7c2d12;color:white;padding:12px 22px;border-radius:12px;text-decoration:none;font-weight:700;box-shadow:0 4px 14px rgba(124,45,18,.3)}
</style></head><body>
<header>
<div style="display:flex;align-items:center;gap:10px;font-weight:800;color:#7c2d12">
<img src="../logo-usahidsolo.png" onerror="this.src='/logo-usahidsolo.png'" style="width:42px;height:42px;object-fit:contain"> USAHID SOLO
</div>
<a href="/" style="color:#7c2d12;font-weight:700;text-decoration:none">Beranda</a>
</header>
<div class="wrap">
<h2 style="color:#7c2d12;font-family:'Plus Jakarta Sans'">Karya</h2>
<div id="list">⏳ Memuat Sheet Karya...</div>
<div style="text-align:center;margin-top:28px">
<a class="btn" href="/">⬅ Kembali ke Beranda</a>
<a class="btn" style="margin-left:10px;background:#7c2d12" href="/buku/">📚 Buku</a>
</div>
</div>
<script>
const API="https://script.google.com/macros/s/AKfycbxOb93EOtRsz980tV-lWvDfadWdUnZMMMNj0yNnbtPkj5lXd5nTPse8CkmKKqxDV0KY/exec";
fetch(API+"?page=karya&t="+Date.now()).then(r=>r.json()).then(d=>{
  let el=document.getElementById('list');
  if(!d || !d.length){ el.innerHTML='Sheet Karya kosong'; return; }
  // Kalau masih keluar Buku Ajar = API belum update bro
  if(d[0].judul && d[0].judul.includes('Buku Ajar') || d[0].judul_buku){
    el.innerHTML = '<p style="color:#b91c1c;background:#fef2f2;padding:12px;border-radius:10px">⚠️ API masih ngasih data BUKU bro, bukan KARYA! <br>Sampean belum Deploy New Version di Apps Script. Data Sheet Karya (Merdeka) belum kebaca.</p>' + 
    '<div class="grid">'+d.map(x=>`<div class="card"><h3>${x.judul||x.judul_buku||'-'}</h3><p style="font-size:13px;color:#555">${x.keterangan||''}</p><span class="badge">${x.tahun||''}</span><span class="badge">${x.jenis||x.kategori||''}</span></div>`).join('')+'</div>';
    return;
  }
  el.innerHTML='<div class="grid">'+d.map(x=>`<div class="card"><h3>${x.judul||'-'}</h3><p style="font-size:13px;color:#555;margin:8px 0">${x.keterangan||''}</p><div><span class="badge">${x.tahun||''}</span> <span class="badge">${x.jenis||''}</span> <span class="badge">No ${x.nonor||''}</span></div></div>`).join('')+'</div>';
}).catch(e=>{ document.getElementById('list').innerHTML='Gagal: '+e; });
</script>
</body></html>
