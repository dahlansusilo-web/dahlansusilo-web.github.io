<!DOCTYPE html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Login - USAHID</title>
<style>
body{font-family:sans-serif;background:#fdf8f0;margin:0;display:flex;justify-content:center;align-items:center;min-height:100vh}
.card{background:white;padding:24px;border-radius:12px;width:90%;max-width:360px;box-shadow:0 2px 10px rgba(0,0,0,.1);text-align:center}
input{width:100%;padding:10px;margin:8px 0;box-sizing:border-box;border:1px solid #ccc;border-radius:8px}
button{width:100%;padding:12px;background:#7a1f1f;color:white;border:none;border-radius:8px;font-weight:bold;cursor:pointer}
</style></head>
<body>
<div class="card">
<h2 style="color:#7a1f1f;margin:0">USAHID</h2>
<p style="margin:5px 0 15px">Portal Kuliah</p>
<input id="nim" placeholder="NIM / NIDN - cth: D01">
<input id="password" type="password" placeholder="Password - cth: DS123">
<button id="btn-login" onclick="login()">LOGIN</button>
<p id="msg" style="color:red;font-size:13px"></p>
<p style="font-size:12px;color:#888">Dosen: D01 / DS123<br>Mahasiswa: 2023001 / mhs1</p>
</div>
<script>
const API = "https://script.google.com/macros/s/AKfycbxOb93EOtRsz980tV-lWvDfadWdUnZMMMNj0yNnbtPkj5lXd5nTPse8CkmKKqxDV0KY/exec";
async function login(){
  const nim = document.getElementById('nim').value.trim();
  const password = document.getElementById('password').value.trim();
  if(!nim || !password){ document.getElementById('msg').innerText="NIM + Password wajib diisi!"; return; }
  const btn = document.getElementById('btn-login');
  btn.innerText="Mlebu..."; btn.disabled=true;
  document.getElementById('msg').innerText="";
  try{
    const url = API + "?page=login&nim=" + encodeURIComponent(nim) + "&password=" + encodeURIComponent(password) + "&t=" + Date.now();
    console.log(url);
    const res = await fetch(url);
    const data = await res.json();
    console.log(data);
    if(data.success){
      localStorage.setItem('kuliah_user', JSON.stringify(data));
      location.href='/kuliah/';
    } else {
      document.getElementById('msg').innerText="NIM / Password salah!";
      btn.innerText="LOGIN"; btn.disabled=false;
    }
  }catch(e){
    document.getElementById('msg').innerText="Error koneksi: "+e;
    btn.innerText="LOGIN"; btn.disabled=false;
  }
}
</script>
</body></html>
