<!DOCTYPE html><html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Login Kuliah - USAHID Solo</title>
<style>
*{box-sizing:border-box}
body{background:#f9f5f0;margin:0;font-family:Inter,sans-serif;min-height:100vh;display:flex;flex-direction:column}
header{background:white;padding:12px 20px;display:flex;justify-content:space-between;align-items:center;box-shadow:0 2px 8px rgba(0,0,0,.06);width:100%}
a.logo{display:flex;align-items:center;gap:10px;font-weight:800;color:#7c2d12;text-decoration:none;font-size:15px}
.main{flex:1;display:flex;align-items:center;justify-content:center;padding:20px}
.box{background:white;padding:32px;border-radius:20px;box-shadow:0 10px 30px rgba(0,0,0,.1);width:100%;max-width:380px;border:1px solid #e9ddd0}
input{width:100%;padding:12px;border-radius:10px;border:1px solid #e9ddd0;margin-top:8px;background:#f0f7ff}
button{width:100%;background:#7c2d12;color:white;padding:12px;border:none;border-radius:10px;font-weight:800;margin-top:18px;cursor:pointer;font-size:15px}
button:hover{background:#5a1f0d}
</style></head><body>
<header>
<a class="logo" href="/"><img src="../logo-usahidsolo.png" onerror="this.src='/logo-usahidsolo.png'" style="width:38px"> USAHID SOLO - KULIAH</a>
<a href="/" style="font-size:13px;color:#7c2d12;text-decoration:none;font-weight:700;background:#f0e6d3;padding:6px 14px;border-radius:20px">← Home</a>
</header>
<div class="main">
<div class="box">
<div style="text-align:center;color:#7c2d12;font-weight:800;font-size:18px;margin-bottom:18px">🔒 LOGIN KULIAH USAHID</div>
<label style="font-size:14px;font-weight:600">NIM / NIDN</label>
<input id="nim" placeholder="Contoh: D01 atau 2023004" value="D01">
<label style="margin-top:14px;display:block;font-size:14px;font-weight:600">Password</label>
<input id="pass" type="password" placeholder="****">
<button onclick="login()">Masuk</button>
<p id="msg" style="color:red;text-align:center;font-size:13px;margin-top:12px;min-height:18px"></p>
<div style="text-align:center;margin-top:14px;display:flex;gap:12px;justify-content:center"><a href="/" style="color:#7c2d12;font-size:13px">← Home</a><span style="color:#ccc">|</span><a href="/kuliah/" style="color:#7c2d12;font-size:13px">Daftar MK</a></div>
</div>
</div>
<script>
const API="https://script.google.com/macros/s/AKfycbxOb93EOtRsz980tV-lWvDfadWdUnZMMMNj0yNnbtPkj5lXd5nTPse8CkmKKqxDV0KY/exec";
async function login(){
  let nim=document.getElementById('nim').value.trim();
  let pass=document.getElementById('pass').value.trim();
  if(!nim||!pass){document.getElementById('msg').innerText='Isi NIM & password!';return;}
  document.getElementById('msg').innerText='⏳ Cek akun...';
  try{
    let data=await fetch(API+"?page=mahasiswa&t="+Date.now()).then(r=>r.json());
    let user=data.find(x=> x.nim.toString().toLowerCase()==nim.toLowerCase() && x.password.toString()==pass );
    if(user){ localStorage.setItem('kuliah_user', JSON.stringify(user)); location.href='/kuliah/'; } 
    else { document.getElementById('msg').innerText='NIM / Password salah!'; }
  }catch(e){ document.getElementById('msg').innerText='Gagal konek API: '+e; }
}
document.getElementById('pass').addEventListener('keyup', function(e){ if(e.key==='Enter') login(); });
</script></body></html>
