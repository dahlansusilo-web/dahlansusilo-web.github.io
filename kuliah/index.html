<!DOCTYPE html><html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Kuliah USAHID</title>
<style>body{background:#f9f5f0;margin:0;font-family:Inter,sans-serif}header{background:white;padding:12px 20px;display:flex;justify-content:space-between;align-items:center;box-shadow:0 2px 8px rgba(0,0,0,.06);position:sticky;top:0;z-index:10}.wrap{max-width:1150px;margin:20px auto;padding:0 16px}.table-wrap{background:white;border-radius:18px;overflow:hidden;border:1px solid #e9ddd0;overflow-x:auto}table{width:100%;border-collapse:collapse;min-width:600px}th{background:#7c2d12;color:white;padding:12px;text-align:left;font-size:12px}td{padding:12px;border-bottom:1px solid #f0e6d3;font-size:14px}a.btn-detail{background:#7c2d12;color:white;padding:6px 14px;border-radius:8px;text-decoration:none;font-weight:700;font-size:13px}</style></head><body>
<header>
<header><a href="/" style="display:flex;align-items:center;gap:10px;font-weight:800;color:#7c2d12;text-decoration:none"><img src="../logo-usahidsolo.png" onerror="this.src='/logo-usahidsolo.png'" style="width:42px"> USAHID SOLO - KULIAH</a><div style="display:flex;align-items:center;gap:8px"><span id="userInfo" style="font-size:12px;background:#f0e6d3;padding:6px 12px;border-radius:20px;color:#7c2d12;font-weight:700"></span><a href="#" onclick="logout()" style="font-size:12px;color:white;background:#7c2d12;padding:6px 12px;border-radius:20px;text-decoration:none;font-weight:700">Logout</a></div></header>
<div style="display:flex;align-items:center;gap:8px"><span id="userInfo" style="font-size:12px;background:#f0e6d3;padding:6px 12px;border-radius:20px;color:#7c2d12;font-weight:700"></span> <a href="#" onclick="logout()" style="font-size:12px;color:white;background:#7c2d12;padding:6px 12px;border-radius:20px;text-decoration:none;font-weight:700">Logout</a></div></header>
<div class="wrap">
<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px"><h2 style="color:#7c2d12;margin:0">Daftar Mata Kuliah</h2><a href="/" style="text-decoration:none;color:#7c2d12;font-size:13px">← Home</a></div>
<div class="table-wrap"><table><thead><tr><th>Kode</th><th>Nama MK</th><th>SKS</th><th>Semester</th><th>Aksi</th></tr></thead><tbody id="list"><tr><td colspan="5">⏳ Memuat...</td></tr></tbody></table></div>
</div>
<script>
const API="https://script.google.com/macros/s/AKfycbxOb93EOtRsz980tV-lWvDfadWdUnZMMMNj0yNnbtPkj5lXd5nTPse8CkmKKqxDV0KY/exec";
let user = JSON.parse(localStorage.getItem('kuliah_user')||'null');
if(!user){ location.href='/kuliah/login.html'; }
document.getElementById('userInfo').innerText=user.nama+' ('+user.role+')';
function logout(){ localStorage.removeItem('kuliah_user'); location.href='/kuliah/login.html'; }
fetch(API+"?page=matakuliah&t="+Date.now()).then(r=>r.json()).then(data=>{
  if(!data.length){ document.getElementById('list').innerHTML='<tr><td colspan=5>Tidak ada MK</td></tr>'; return; }
  document.getElementById('list').innerHTML=data.map(x=>`<tr><td><b>${x.kode_mk||''}</b></td><td>${x.nama_mk||''}</td><td>${x.sks||''}</td><td>${x.semester||''}</td><td><a class="btn-detail" href="detail.html?mk=${x.kode_mk}">Buka</a></td></tr>`).join('');
});
</script></body></html>
