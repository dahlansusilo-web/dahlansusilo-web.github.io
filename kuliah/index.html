<!DOCTYPE html><html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Kuliah</title>
let u = JSON.parse(localStorage.getItem('kuliah_user')||'null');
if(!u) location.href='/kuliah/login.html';
<style>body{background:#f9f5f0;margin:0;font-family:Inter,sans-serif}header{background:white;padding:12px 20px;display:flex;justify-content:space-between;align-items:center;box-shadow:0 2px 8px rgba(0,0,0,.06);position:sticky;top:0}.wrap{max-width:1100px;margin:20px auto;padding:0 16px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}.card{background:white;border-radius:18px;padding:20px;border:1px solid #e9ddd0;box-shadow:0 6px 18px rgba(0,0,0,.05)}.card h3{color:#7c2d12;margin:0}.btn{background:#7c2d12;color:white;padding:10px 18px;border-radius:10px;text-decoration:none;font-weight:700;display:inline-block;margin-top:10px}.badge{background:#f0e6d3;color:#7c2d12;padding:4px 10px;border-radius:20px;font-size:11px;font-weight:700}</style></head><body>
<header><div style="display:flex;align-items:center;gap:10px;font-weight:800;color:#7c2d12"><img src="../logo-usahidsolo.png" onerror="this.src='/logo-usahidsolo.png'" style="width:42px;height:42px"> USAHID SOLO</div><a href="/" style="color:#7c2d12;font-weight:700;text-decoration:none">Beranda</a></header>
<div class="wrap"><h2 style="color:#7c2d12">Mata Kuliah</h2><div id="list" class="grid">⏳ Memuat...</div>
<div style="text-align:center;margin-top:20px"><a class="btn" href="/">⬅ Beranda</a></div></div>
<script>
const API="https://script.google.com/macros/s/AKfycbxOb93EOtRsz980tV-lWvDfadWdUnZMMMNj0yNnbtPkj5lXd5nTPse8CkmKKqxDV0KY/exec";
fetch(API+"?page=matakuliah&t="+Date.now()).then(r=>r.json()).then(d=>{
  document.getElementById('list').innerHTML=d.map(x=>`<div class="card"><h3>${x.kode} - ${x.nama}</h3><p><span class="badge">${x.sks} SKS</span> <span class="badge">Semester ${x.semester}</span> <span class="badge">Kelas ${x.kelas}</span></p><a class="btn" href="/kuliah/detail.html?mk=${x.kode}">Lihat Materi & Mahasiswa →</a></div>`).join('');
});
</script></body></html>
